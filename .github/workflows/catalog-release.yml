# Releases catalog changes: every catalog change merged to main gets the next
# patch release, which the release workflow builds and publishes.
name: catalog-release

on:
  push:
    branches: [main]
    paths:
      - catalog/*.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # Tags pushed with the default token don't start the release workflow.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.VEXXHOST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.VEXXHOST_CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Tag the next patch release
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$latest" ]; then
            echo "No release yet; the first release is tagged by hand."
            exit 0
          fi
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already released."
            exit 0
          fi
          next=$(echo "$latest" | awk -F. '{printf "%s.%s.%d", $1, $2, $3 + 1}')
          echo "Tagging $next"
          git tag "$next"
          git push origin "$next"
