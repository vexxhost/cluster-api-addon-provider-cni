name: e2e

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.focus }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        focus:
          - Cilium
          - Calico-Chained
          - KCP
          - Adoption-Cilium
          - Adoption-Cilium-Mirror
          - Adoption-Calico
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
      # CAPD runs every workload cluster node as a container, so raise the
      # inotify limits like the Cluster API e2e jobs do.
      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=1048576
          sudo sysctl -w fs.inotify.max_user_instances=8192
      # The mirror spec pulls Cilium from a plain HTTP registry under the
      # flattened image names magnum-cluster-api uses for mirrors.
      - name: Start a registry mirror
        if: matrix.focus == 'Adoption-Cilium-Mirror'
        run: |
          docker run -d --restart=always -p 5000:5000 --name mirror registry:2
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:5000/v2/; do sleep 1; done'
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          for version in v1.15.3 v1.15.19; do
            crane copy --platform linux/amd64 --insecure \
              "quay.io/cilium/cilium:$version" "127.0.0.1:5000/cilium-cilium:$version"
            crane copy --platform linux/amd64 --insecure \
              "quay.io/cilium/operator-generic:$version" "127.0.0.1:5000/cilium-operator-generic:$version"
          done
          echo "E2E_MIRROR=true" >> "$GITHUB_ENV"
      - name: Run e2e tests
        run: make test-e2e GINKGO_FOCUS='\[${{ matrix.focus }}\]' ARTIFACTS=${{ github.workspace }}/_artifacts
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ matrix.focus }}
          path: _artifacts
          if-no-files-found: ignore
          retention-days: 7
