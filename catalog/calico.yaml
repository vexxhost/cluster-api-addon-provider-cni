# Calico, installed with the upstream tigera-operator Helm chart.
#
# The operator manages Calico's CRDs and components. It takes over a
# manifest-based install in kube-system by itself (moving it to
# calico-system), as long as the operator runs the same Calico version, which
# is what the controller installs first when it adopts an existing Calico.
# The values leave the IP pools unset: on a new cluster the operator derives
# them from the kubeadm pod subnet, and on an adopted one it keeps the pools
# it finds.
type: calico
chart:
  repoURL: https://docs.tigera.io/calico/charts
  name: tigera-operator
release:
  name: calico
  namespace: tigera-operator
  # The operator runs on the host network, which the baseline Pod Security
  # level many clusters enforce doesn't allow.
  namespaceLabels:
    pod-security.kubernetes.io/enforce: privileged
detect:
  - kind: DaemonSet
    namespace: kube-system
    name: calico-node
    container: calico-node
  - kind: DaemonSet
    namespace: calico-system
    name: calico-node
    container: calico-node
# From Calico 3.32 the chart no longer carries the CRDs of the resources it
# creates. Upstream renders this chart and applies it with kubectl before
# installing the operator, and the controller does the same.
crdChart:
  name: crd.projectcalico.org.v1
  release: calico-crds
  versions: ">= 3.32.0"
helmOptions:
  wait: true
  timeout: 15m0s
maxMinorSkip: 1
valuesTemplate: |
  installation:
    enabled: true
    {{- with .ImageRepository }}
    registry: {{ trimSuffix "/" . }}/
    {{- end }}
    {{- if .KubeProxyReplacement }}
    calicoNetwork:
      linuxDataplane: BPF
    {{- end }}
  {{- with .ImageRepository }}
  tigeraOperator:
    registry: {{ trimSuffix "/" . }}
  {{- end }}
  {{- if .KubeProxyReplacement }}
  kubernetesServiceEndpoint:
    host: {{ .APIServerHost | quote }}
    port: {{ .APIServerPort | quote }}
  {{- end }}
minors:
  - minor: "3.29"
    version: v3.29.7
    kubernetes: ">= 1.29.0-0, < 1.33.0-0"
    compatibilitySource: https://docs.tigera.io/calico/3.29/getting-started/kubernetes/requirements
  - minor: "3.30"
    version: v3.30.7
    kubernetes: ">= 1.31.0-0, < 1.36.0-0"
    compatibilitySource: https://docs.tigera.io/calico/3.30/getting-started/kubernetes/requirements
  - minor: "3.31"
    version: v3.31.7
    kubernetes: ">= 1.32.0-0, < 1.36.0-0"
    compatibilitySource: https://docs.tigera.io/calico/3.31/getting-started/kubernetes/requirements
  - minor: "3.32"
    version: v3.32.4
    kubernetes: ">= 1.34.0-0, < 1.37.0-0"
    compatibilitySource: https://docs.tigera.io/calico/3.32/getting-started/kubernetes/requirements
  - minor: "3.33"
    version: v3.33.1
    kubernetes: ">= 1.35.0-0, < 1.38.0-0"
    compatibilitySource: https://docs.tigera.io/calico/3.33/getting-started/kubernetes/requirements
