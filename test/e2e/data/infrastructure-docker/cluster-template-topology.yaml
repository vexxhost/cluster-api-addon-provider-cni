# A CAPD workload cluster from the Cluster API quick-start ClusterClass, with a
# ClusterCNI. The cluster has no other CNI: its nodes only become Ready once the
# controller has installed the CNI.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  clusterNetwork:
    services:
      cidrBlocks: ["${DOCKER_SERVICE_CIDRS}"]
    pods:
      cidrBlocks: ["${DOCKER_POD_CIDRS}"]
    serviceDomain: "${DOCKER_SERVICE_DOMAIN}"
  topology:
    classRef:
      name: quick-start
    version: "${KUBERNETES_VERSION}"
    controlPlane:
      replicas: ${CONTROL_PLANE_MACHINE_COUNT}
    workers:
      machineDeployments:
        - class: default-worker
          name: md-0
          replicas: ${WORKER_MACHINE_COUNT}
          failureDomain: fd4
    variables:
      - name: etcdImageTag
        value: ""
      - name: coreDNSImageTag
        value: ""
      - name: preLoadImages
        value: ${DOCKER_PRELOAD_IMAGES:-[]}
---
apiVersion: cni.vexxhost.com/v1alpha1
kind: ClusterCNI
metadata:
  name: "${CLUSTER_NAME}"
spec: ${E2E_CLUSTERCNI_SPEC}
