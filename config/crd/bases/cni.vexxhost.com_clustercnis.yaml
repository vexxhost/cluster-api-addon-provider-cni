    - cluster-api
    kind: ClusterCNI
    listKind: ClusterCNIList
    plural: clustercnis
    shortNames:
    - ccni
    singular: clustercni
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.observedVersion
      name: Version
      type: string
    - jsonPath: .status.targetVersion
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterCNI manages the CNI of the Cluster API Cluster with the
          same name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired CNI.
            properties:
              chartRepository:
                description: |-
                  chartRepository replaces the Helm chart repository from the catalog,
                  for example with an OCI mirror. It is immutable.
                type: string
              imageRepository:
                description: imageRepository is a registry mirror for the CNI images.
                type: string
              kubeProxyReplacement:
                description: kubeProxyReplacement makes the CNI replace kube-proxy,
                  where supported.
                type: boolean
              podCIDRs:
                description: |-
                  podCIDRs are the pod networks. Defaults to the Cluster's
                  spec.clusterNetwork.pods.cidrBlocks.
                items:
                  type: string
                maxItems: 2
                type: array
                x-kubernetes-list-type: atomic
              providerConfig:
                description: |-
                  providerConfig holds Helm values merged over the values the controller
                  renders, for settings that the fields above do not cover.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              type:
                description: type is the CNI to install.
                enum:
                - cilium
                - calico
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
              version:
                description: |-
                  version selects the CNI version. Leave it empty to follow the newest
                  version that supports the cluster's Kubernetes version. A minor version
                  such as "1.16" follows that minor's latest patch, and a full version such
                  as "1.16.5" pins that patch.
                pattern: ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$
                type: string
            required:
