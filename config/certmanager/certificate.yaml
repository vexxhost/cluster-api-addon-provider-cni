# Serving certificate of the lifecycle hook server. clusterctl installs
# cert-manager. Names are written out in full because kustomize does not
# rewrite references inside cert-manager resources.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert
  namespace: system
spec:
  dnsNames:
    - capi-cni-webhook-service.capi-cni-system.svc
    - capi-cni-webhook-service.capi-cni-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: capi-cni-selfsigned-issuer
  secretName: capi-cni-webhook-service-cert
